name: Deploy Demo

on:
  push:
    branches:
      - main
      - ios26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'ios26'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-demo-${{ github.ref_name }}-ionic${{ matrix.ionic-major }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - ionic-major: 9
            ionic-version: 9.0.0
            eslint-plugin-version: 22.1.0
            configuration: production
            main-environment: ''
            ios26-environment: ios26
          - ionic-major: 8
            ionic-version: 8.8.19
            eslint-plugin-version: 21.3.0
            configuration: production,ionic8
            main-environment: ionic8
            ios26-environment: ios26-ionic8
    name: Deploy ${{ github.ref_name }} Ionic ${{ matrix.ionic-major }} demo
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - run: npm ci
      - run: npm install --no-save --package-lock=false @ionic/angular@${{ matrix.ionic-version }} @ionic/core@${{ matrix.ionic-version }}
      - run: npm run build

      - run: npm ci
        working-directory: ./demo
      - run: npm install --no-save --package-lock=false @ionic/angular@${{ matrix.ionic-version }} @ionic/core@${{ matrix.ionic-version }} @rdlabo/eslint-plugin-rules@${{ matrix.eslint-plugin-version }}
        working-directory: ./demo
      - run: npm run build -- --configuration=${{ matrix.configuration }}
        working-directory: ./demo

      - name: Select Cloudflare Workers environment
        id: deploy-target
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          MAIN_ENVIRONMENT: ${{ matrix.main-environment }}
          IOS26_ENVIRONMENT: ${{ matrix.ios26-environment }}
        run: |
          case "$BRANCH_NAME" in
            main)
              echo "environment=$MAIN_ENVIRONMENT" >> "$GITHUB_OUTPUT"
              ;;
            ios26)
              echo "environment=$IOS26_ENVIRONMENT" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deployment branch: $BRANCH_NAME" >&2
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Workers
        env:
          WRANGLER_ENVIRONMENT: ${{ steps.deploy-target.outputs.environment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$WRANGLER_ENVIRONMENT" ]; then
            npx wrangler deploy --env "$WRANGLER_ENVIRONMENT"
          else
            npx wrangler deploy --env=""
          fi
