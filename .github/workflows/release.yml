name: Release

on:
  push:
    tags:
      - 'v*'
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Update npm
        run: npm install -g npm@latest

      - name: Extract version from tag
        id: tag_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Publish packages
        run: |
          VERSION="${{ steps.tag_version.outputs.version }}"
          IS_STABLE=$(echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' && echo true || echo false)

          echo "Publishing... $IS_STABLE"
          if [ "$IS_STABLE" = "true" ]; then
            npm publish --provenance --access public
          else
            npm publish --provenance --access public --tag next
          fi

  build-pr-beta:
    if: >-
      (github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/beta') ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      artifact: ${{ steps.pack.outputs.artifact }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      mode: ${{ steps.gate.outputs.mode }}
      package: ${{ steps.pack.outputs.package }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      version: ${{ steps.pack.outputs.version }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Require CI and administrator beta request
        id: gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const requiredWorkflows = ['Lint', 'E2E Screenshot Tests Pull Request'];
            const { owner, repo } = context.repo;
            const isMerge = context.eventName === 'pull_request';
            const pull_number = isMerge
              ? context.payload.pull_request.number
              : context.payload.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({ owner, repo, pull_number });

            if (!isMerge) {
              const requester = context.payload.comment.user.login;
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: requester,
              });
              if (permission.permission !== 'admin') {
                core.notice(`@${requester} is not a repository administrator; /beta was ignored.`);
                core.setOutput('allowed', 'false');
                return;
              }
            }

            const eligibleState = isMerge
              ? pullRequest.merged && Boolean(pullRequest.merge_commit_sha)
              : pullRequest.state === 'open' && !pullRequest.draft;
            if (
              !eligibleState ||
              pullRequest.head.repo.full_name !== context.payload.repository.full_name
            ) {
              core.notice('The PR is not an eligible same-repository PR.');
              core.setOutput('allowed', 'false');
              return;
            }
            const ciSha = pullRequest.head.sha;
            const candidateSha = isMerge ? pullRequest.merge_commit_sha : ciSha;

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              head_sha: ciSha,
              event: 'pull_request',
              per_page: 100,
            });
            const incomplete = [];
            for (const workflowName of requiredWorkflows) {
              const latest = runs
                .filter((run) => run.name === workflowName)
                .sort((left, right) => right.run_number - left.run_number)[0];
              if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
                incomplete.push(workflowName);
              }
            }
            if (incomplete.length > 0) {
              const shortSha = candidateSha.slice(0, 12);
              const body = isMerge
                ? `🚫 Merged commit \`${shortSha}\` was not beta-published because required CI had not passed: ${incomplete.join(', ')}.`
                : `🚫 \`/beta\` did not publish commit \`${shortSha}\`. Required CI has not passed: ${incomplete.join(', ')}. Run \`/beta\` again after CI succeeds.`;
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
              core.notice(`Required CI has not passed: ${incomplete.join(', ')}`);
              core.setOutput('allowed', 'false');
              return;
            }

            core.setOutput('allowed', 'true');
            core.setOutput('head-sha', candidateSha);
            core.setOutput('mode', isMerge ? 'merge' : 'comment');
            core.setOutput('pr-number', String(pull_number));
      - name: Checkout requested PR commit
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.gate.outputs.head-sha }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm
        if: steps.gate.outputs.allowed == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.gate.outputs.allowed == 'true'
        run: npm ci

      - name: Set PR beta version
        if: steps.gate.outputs.allowed == 'true'
        env:
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          VERSION="${BASE_VERSION}-beta.pr${PR_NUMBER}.${HEAD_SHA:0:12}"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts

      - name: Build package
        if: steps.gate.outputs.allowed == 'true'
        run: npm run build

      - name: Pack PR beta
        if: steps.gate.outputs.allowed == 'true'
        id: pack
        env:
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          ARTIFACT_NAME="npm-pr-beta-${PR_NUMBER}-${HEAD_SHA}"
          PACK_DIR="$RUNNER_TEMP/npm-pr-beta"
          mkdir -p "$PACK_DIR"
          npm pack --ignore-scripts --pack-destination "$PACK_DIR"
          echo "artifact=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload packed package
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: ${{ runner.temp }}/npm-pr-beta/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-pr-beta:
    needs: build-pr-beta
    if: needs.build-pr-beta.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_TAG: beta
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read

    steps:
      - name: Revalidate beta authorization and PR head
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          HEAD_SHA: ${{ needs.build-pr-beta.outputs.head-sha }}
          MODE: ${{ needs.build-pr-beta.outputs.mode }}
          PR_NUMBER: ${{ needs.build-pr-beta.outputs.pr-number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const { data: pullRequest } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (process.env.MODE === 'merge') {
              if (!pullRequest.merged || pullRequest.merge_commit_sha !== process.env.HEAD_SHA) {
                core.setFailed('The merged commit no longer matches the package artifact.');
              }
              return;
            }
            if (pullRequest.head.sha !== process.env.HEAD_SHA) {
              core.setFailed('The PR head changed after /beta; a fresh administrator /beta is required.');
              return;
            }
            const requester = context.payload.comment.user.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: requester,
            });
            if (data.permission !== 'admin') {
              core.setFailed(`@${requester} is no longer a repository administrator.`);
            }
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Download packed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build-pr-beta.outputs.artifact }}
          path: ${{ runner.temp }}/npm-pr-beta

      - name: Publish PR beta
        run: |
          PACKAGE_NAME="${{ needs.build-pr-beta.outputs.package }}"
          VERSION="${{ needs.build-pr-beta.outputs.version }}"
          case "$VERSION" in
            *-beta.pr*) ;;
            *)
              echo "::error::Refusing to publish non-PR-beta version: $VERSION"
              exit 1
              ;;
          esac
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} already exists; skipping publish."
          else
            npm publish "$RUNNER_TEMP"/npm-pr-beta/*.tgz --ignore-scripts --provenance --access public --tag beta
          fi

      - name: Comment exact install command
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PACKAGE_NAME: ${{ needs.build-pr-beta.outputs.package }}
          PR_NUMBER: ${{ needs.build-pr-beta.outputs.pr-number }}
          VERSION: ${{ needs.build-pr-beta.outputs.version }}
          HEAD_SHA: ${{ needs.build-pr-beta.outputs.head-sha }}
          MODE: ${{ needs.build-pr-beta.outputs.mode }}
        with:
          script: |
            const shortSha = process.env.HEAD_SHA.slice(0, 12);
            const marker = `<!-- npm-pr-beta:${process.env.HEAD_SHA} -->`;
            const authorization = process.env.MODE === 'merge'
              ? `The PR was merged after CI passed for commit \`${shortSha}\``
              : `CI passed and a repository administrator requested \`/beta\` for commit \`${shortSha}\``;
            const body = `${marker}\n### npm beta published\n\n${authorization}. Install the immutable version with:\n\n\`\`\`sh\nnpm install ${process.env.PACKAGE_NAME}@${process.env.VERSION}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
